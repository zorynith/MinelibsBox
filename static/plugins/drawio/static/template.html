<!DOCTYPE html>
<html><title> Draw.io </title>
<head>
	<link rel="shortcut icon" href="@@pluginHost@@static/images/icon.png">
	<style type="text/css">
		html, body, #wrapper {
			height:100%;
			width:100%;
			margin:0;
			padding:0;
			border:0;
		}
		table#wrapper {
			height:75%;
		}
		#wrapper td {
			vertical-align:middle;
			text-align:center;
		}
		iframe {
			border:0;
			position:fixed;
			top:0;
			left:0;
			right:0;
			bottom:0;
			width:100%;
			height:100%
		}
	</style>

</head>
<body>
    	<script type="text/javascript">
		var editor = @@editorJs@@;
		var newfile = @@newfileJs@@;
		var autosave = @@autosaveJs@@;
		var saveUrl = "@@saveUrl@@";

		// json messages refer: https://desk.draw.io/support/solutions/articles/16000042544-how-does-embed-mode-work-
		function edit(file)
		{
			var iframe = document.createElement('iframe');
			iframe.setAttribute('frameborder', '0');

			var close = function()
			{
				window.removeEventListener('message', receive);
				document.body.removeChild(iframe);
			};

			var receive = function(evt)
			{
				if (evt.data && evt.data.length > 0)
				{
					var msg = JSON.parse(evt.data);

					if (msg.event == 'init')
					{
						if (newfile)
						{
						    iframe.contentWindow.postMessage(JSON.stringify({action: 'template'}),'*');
						}
						else
						{
							iframe.contentWindow.postMessage(JSON.stringify({action: 'load',
							    autosave: autosave, xml: file}),'*');
						}
					}
					else if (msg.event == 'export')
					{
						close();
					}
					else if (msg.event == 'autosave')
					{
					    iframe.contentWindow.postMessage(JSON.stringify({action: 'status',
							    message: "@@lngSaving@@", modified: true}),'*');
					    fetch(saveUrl, {method: 'POST', body: msg.xml}).then(function(){
					            iframe.contentWindow.postMessage(JSON.stringify({action: 'status',
							    message: "@@lngSaved@@", modified: false}),'*');
					    }).catch(function(){});
					}
					else if (msg.event == 'save')
					{
					    iframe.contentWindow.postMessage(JSON.stringify({action: 'spinner',
							    message: "@@lngSaving@@", show: true, enabled: false}),'*');
					    fetch(saveUrl, {method: 'POST', body: msg.xml}).then(function(){
					            iframe.contentWindow.postMessage(JSON.stringify({action: 'spinner',
							    message: '', show: false}),'*');

					            iframe.contentWindow.postMessage(JSON.stringify({action: 'spinner',
							    message: "@@lngSaved@@", show: true}),'*');

					            setTimeout(function() {
					                iframe.contentWindow.postMessage(JSON.stringify({action: 'spinner',
							    message: '', show: false}),'*');
					            }, 500);
					    }).catch(function(){
					            alert('Save failed!');
					    });
					}
					else if (msg.event == 'exit')
					{
						close();
					}
				}
			};

			window.addEventListener('message', receive);
			iframe.setAttribute('src', editor);
			document.body.appendChild(iframe);
		};

		edit(@@contentJs@@);
	</script>
</body>
</html>
