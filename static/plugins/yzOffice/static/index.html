<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1, user-scalable=no" />
<meta charset="utf-8">
<title>@@title@@</title>
<style>
	body {margin: 0;font-family: "Helvetica Neue Light", "Segoe UI Semilight", sans-serif;background:#f0f0f0 !important;}
	.load-content{
		position: fixed;overflow: hidden;z-index: 100;top:0;left:0;right:0;bottom:0;
		font-size:13px;color:#666;
	}
	.app-icon{text-align: center;position: absolute;width: 100%;top:40%;margin-top: -150px;}
	.app-icon img{max-height: 150px;}
	.app-icon .app-name{font-size:16px;color:#222;}
	.load-status{margin: 20px auto;}
	.load-status .progress{
		width:300px;height:30px;margin: 10px auto;position: relative;
		background-image: linear-gradient(to right,#ddd, #f6f6f6, #ddd);
	}
	.progress-slider .content{position: absolute;width: 100%;color:#29792c;font-size:12px;line-height:30px;}
	.progress-slider .left{float:left;padding-left: 10px;}
	.progress-slider .right{float:right;padding-right: 10px;}
	.progress-bar{opacity: 0.7;height:100%;background:#5cb85c;transition:width .3s;}
	.clear{clear:both;}
	.progress-text{text-align: center;display: block;width:300px;margin: 0 auto;padding: 10px;word-wrap: break-word;}
	.progress-text.alert-danger{color:#c00;}
	.hidden{display:none;}
	.load_repeat{color:#2196F3;text-decoration:none;}
</style>
</head>
<body>
	<div class="load-content display">
		<div class="app-icon">
			<img src="@@pluginHost@@static/images/icon.png" />
			<div class="app-name">@@appName@@</div>
			<div class="load-status">
				<div class="progress-text alert">@@lngTransfer@@</div>
				<div class="progress-slider progress hidden">
					<div class="progress-bar" style="width:0%;"></div>
					<div class="content">
						<span class="left"></span>
						<span class="right"></span>
						<div class="clear"></div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div id="MyViewerDiv"></div>
<script type="text/javascript">
	var LNG = @@LNG@@;
	var path = '@@pathJs@@';
	var apiBase = '@@apiBase@@';
	var apiUrl = {
		task: apiBase + 'task&path=' + encodeURIComponent(path),
		restart: apiBase + 'restart&path=' + encodeURIComponent(path)
	};
	var $ = function(sel){ return document.querySelector(sel); };
	var repeatTimer;
	var request = function(){
		$('.load-content').style.display = 'block';
		$('.progress-text').classList.remove('alert-danger');
		$('.progress-text').innerHTML = LNG.transfer;
		$('.progress-bar').style.width = '0%';
		clearInterval(repeatTimer);
		taskStatus();
		repeatTimer = setInterval(taskStatus, 600);
	};
	var taskStatus = function(){
		fetch(apiUrl.task, { credentials: 'same-origin' })
			.then(function(r){ return r.json(); })
			.then(statusUpdate)
			.catch(function(){});
	};
	var statusUpdate = function(data){
		if(!data) return;
		if(!data.code){
			var error = data.data;
			if(typeof error !== 'string') error = LNG.error;
			clearInterval(repeatTimer);
			showRetry(error);
			return;
		}
		if(!data.data) return;
		if(data.data.success == 1){
			clearInterval(repeatTimer);
			$('.progress-text').innerHTML = LNG.convert;
			window.location.reload();
			return;
		}
	}
	var showRetry = function(error){
		$('.progress-slider').classList.add('hidden');
		$('.progress-text').classList.add('alert-danger');
		$('.progress-text').innerHTML = error + '&nbsp;&nbsp;<a class="load_repeat" href="javascript:void(0);">' + LNG.transferAgain + '</a>';
	};
	document.addEventListener('click', function(e){
		if(e.target && e.target.classList && e.target.classList.contains('load_repeat')){
			fetch(apiUrl.restart, { credentials: 'same-origin' })
				.then(function(r){ return r.json(); })
				.then(function(data){ if(data.code) request(); })
				.catch(function(){});
		}
	});
	document.addEventListener('DOMContentLoaded', request);
</script>
</body>
</html>
